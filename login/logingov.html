<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala do futuro v2</title>
    
    <!-- CSS da página  -->
    <style>
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        
        #timer {
            background: #ff3b30;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            position: fixed;
            top: 10px;
            right: 10px;
            font-weight: bold;
            z-index: 100;
        }

        .card {
            background: #1a1a1a;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #333;
        }

        img {
            max-width: 200px;
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Simulação do tempo ou bomba invisivel -->
    <div id="timer">10</div>

    <div class="card" style="text-align: center; max-width: 380px; width: 90%;">
        <h1>Sala do Futuro V2</h1>
        <p style="color: #bbb; margin-bottom: 20px;">Ambiente integrado para Professores e Servidores da Rede Estadual.</p>
        
        <button id="btnAcessarAgora" style="background: #2f80ed; color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: opacity 0.2s;">
            Acessar Painel do Docente Agora
        </button>

        <div style="margin-top: 14px;">
            <a href="../index.html" style="color: #888; font-size: 0.9rem; text-decoration: none;">Voltar para escolha de perfil</a>
        </div>
        
        <!-- Imagem e imagem... -->
        <img src="../logosp.png" alt="Logo do governo de sp">
    </div>

    <!-- Batata do temporizador -->
    <script>
        let segundos = 10;
        
        document.getElementById('btnAcessarAgora')?.addEventListener('click', () => {
            window.location.href = "Prof/Index.html";
        });

        const intervalo = setInterval(() => {
            segundos--;
            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.innerText = segundos;
            }
            
            if (segundos <= 0) {
                clearInterval(intervalo);
                window.location.href = "Prof/Index.html";
            }
        }, 1000);
    </script>

</body>
</html>
